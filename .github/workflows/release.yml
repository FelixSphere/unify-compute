# The ONLY way unify-compute reaches staging or production.
#
#   gh workflow run release.yml --ref main -f environment=staging \
#     -f compute_api_image=ghcr.io/felixsphere/unify-compute-api@sha256:<d> \
#     -f site_image=ghcr.io/felixsphere/unify-compute-site@sha256:<d> \
#     -f reason="<release name>"
#
# Dispatch only. Merging to main runs ci.yml and stops: merge is not release,
# and release authority is the CI/CD agent's (.claude/agents/cicd.md).
#
# A release is a set of image digests, not a commit: the images are built and
# tested by the publish workflows, and `plan` re-establishes, per digest, that
# the bytes came from a commit on main whose CI passed. That is the chain a
# `needs:` would give if the build lived here; it does not, so it is checked
# rather than assumed. Production additionally refuses digests that staging
# has not run successfully, unless `reason` starts with HOTFIX.
#
# Two registries (ADR-0009, "Runtime registry: ECR"). GHCR is where images are
# built and where provenance is read; a release is named, gated and recorded
# by its GHCR refs. ECR in the AWS account is where the hosts pull from, with
# their instance role, so no host needs a GHCR token. `deploy` copies each
# digest GHCR -> ECR unchanged and proves it, before the host is touched; the
# host is only ever given the ECR ref of the same digest.
#
# Modes:
#   release   cut the environment over to the two digests given
#   rollback  cut back to the host's PREVIOUS_RELEASE (no digests needed)
#   status    read-only: what the host runs, what it would roll back to
name: Release
run-name: "${{ inputs.mode }} ${{ inputs.environment }}: ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to release"
        required: true
        type: choice
        options: [staging, production]
      mode:
        description: "release | rollback (to the host's PREVIOUS_RELEASE) | status (read-only)"
        required: true
        type: choice
        default: release
        options: [release, rollback, status]
      compute_api_image:
        description: "release only: ghcr.io/felixsphere/unify-compute-api@sha256:<digest> (or just sha256:<digest>)"
        required: false
        type: string
      site_image:
        description: "release only: ghcr.io/felixsphere/unify-compute-site@sha256:<digest> (or just sha256:<digest>)"
        required: false
        type: string
      reason:
        description: "Why (release name). Starting with HOTFIX skips the staging-first gate and requires a hotfix record"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Everything that can refuse a release without touching AWS. No
  # credentials in this job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read      # in-flight runs, staging manifests
      packages: read     # registry lookups for provenance
    outputs:
      compute_api_image: ${{ steps.inputs.outputs.compute_api_image }}
      site_image: ${{ steps.inputs.outputs.site_image }}
      build: ${{ steps.provenance.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENVIRONMENT: ${{ inputs.environment }}
      MODE: ${{ inputs.mode }}
      REASON: ${{ inputs.reason }}
      IN_API: ${{ inputs.compute_api_image }}
      IN_SITE: ${{ inputs.site_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Releases run from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::release.yml runs from main only (got $GITHUB_REF). The scripts that touch the host must be the reviewed ones."
            exit 1
          fi

      - name: No other release is in flight
        run: scripts/release/in-flight.sh

      - name: Validate inputs
        id: inputs
        run: |
          set -euo pipefail
          norm() {  # bare sha256:<d> -> full ref
            case "$2" in sha256:*) printf '%s@%s' "$1" "$2" ;; *) printf '%s' "$2" ;; esac
          }
          if [ "$MODE" = release ]; then
            api=$(norm ghcr.io/felixsphere/unify-compute-api "$IN_API")
            site=$(norm ghcr.io/felixsphere/unify-compute-site "$IN_SITE")
            [[ "$api" =~ ^ghcr\.io/felixsphere/unify-compute-api@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::compute_api_image must be ghcr.io/felixsphere/unify-compute-api@sha256:<64 hex>; a tag can be repointed, a digest cannot"; exit 1; }
            [[ "$site" =~ ^ghcr\.io/felixsphere/unify-compute-site@sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::site_image must be ghcr.io/felixsphere/unify-compute-site@sha256:<64 hex>"; exit 1; }
            echo "compute_api_image=$api" >> "$GITHUB_OUTPUT"
            echo "site_image=$site" >> "$GITHUB_OUTPUT"
          elif [ -n "$IN_API$IN_SITE" ]; then
            echo "::error::$MODE takes no digests: rollback uses the host's PREVIOUS_RELEASE, status changes nothing"; exit 1
          fi
          # The reason is free text; it reaches the summary and the run name,
          # never the host payload.
          [ -n "${REASON// /}" ] || { echo "::error::reason is required"; exit 1; }

      - name: Each digest is on main with CI green, and runs on arm64
        id: provenance
        if: inputs.mode == 'release'
        env:
          API: ${{ steps.inputs.outputs.compute_api_image }}
          SITE: ${{ steps.inputs.outputs.site_image }}
        run: |
          set -euo pipefail
          scripts/release/provenance.sh "$API" | tee api.txt
          scripts/release/provenance.sh "$SITE" | tee site.txt
          # /healthz reports compute-api's build; smoke holds it to this.
          echo "build=$(sed -n 's/^commit=//p' api.txt)" >> "$GITHUB_OUTPUT"

      - name: Production runs only what staging ran
        if: inputs.environment == 'production' && inputs.mode == 'release'
        env:
          COMPUTE_API_IMAGE: ${{ steps.inputs.outputs.compute_api_image }}
          SITE_IMAGE: ${{ steps.inputs.outputs.site_image }}
        run: |
          set -euo pipefail
          if [[ "$REASON" == HOTFIX* ]]; then
            if scripts/release/staging-first.sh; then exit 0; fi
            echo "::warning::HOTFIX: releasing to PRODUCTION digests that staging has NOT run. Allowed only for a live outage, a security issue, or data being lost. A record with 'hotfix: true' and '## What was skipped' must follow (ci.yml enforces it)."
            {
              echo "## HOTFIX: staging-first gate bypassed"
              echo
              echo "These digests have no successful staging release. Write the record under"
              echo "\`deploy/releases/\` with \`hotfix: true\` and a \`## What was skipped\` section,"
              echo "and release the same digests to staging afterwards."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/release/staging-first.sh

  deploy:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    # One lane per environment, never cancelled. The in-flight check in `plan`
    # is what makes a second dispatch fail loudly; this is the backstop.
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write   # OIDC: no long-lived AWS keys exist for this repo
      contents: read
      packages: read    # the GHCR side of the copy to ECR
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      MODE: ${{ inputs.mode }}
      REASON: ${{ inputs.reason }}
      API: ${{ needs.plan.outputs.compute_api_image }}
      SITE: ${{ needs.plan.outputs.site_image }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Record who is releasing what, and why
        run: |
          {
            echo "### unify-compute $MODE → $ENVIRONMENT"
            echo
            echo "- Actor: \`$GITHUB_ACTOR\`"
            echo "- Workflow commit: \`$GITHUB_SHA\`"
            echo "- Reason: $REASON"
            [ -z "$API" ] || echo "- compute-api: \`$API\`"
            [ -z "$SITE" ] || echo "- site: \`$SITE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # crane (go-containerregistry, Apache-2.0) copies manifests byte for
      # byte, so an index keeps its digest. `docker buildx imagetools create`
      # re-serialises the index and may not. Pinned by version and checksum
      # (the release's checksums.txt, which matches its SLSA attestation).
      - name: Install crane
        if: inputs.mode == 'release'
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Before anything touches the host: a digest that cannot be copied, or
      # that comes out different, fails here with the old release still up.
      - name: Copy the exact digests from GHCR to ECR, and prove they are unchanged
        id: ecr
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          # crane's credentials only, for this job only.
          export DOCKER_CONFIG="$RUNNER_TEMP/crane-auth"
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          aws ecr get-login-password --region "$AWS_REGION" | crane auth login "$registry" -u AWS --password-stdin

          for pair in "api=$API" "site=$SITE"; do
            key=${pair%%=*}; src=${pair#*=}
            repo=${src%@*}; repo=${repo##*/}
            digest=${src#*@}
            dst="$registry/$repo"
            tag="sha256-${digest#sha256:}"   # derived from the digest, so an immutable tag can never need to move

            [ "$(crane digest "$src")" = "$digest" ] || { echo "::error::GHCR does not serve $digest for $src"; exit 1; }

            if out=$(aws ecr describe-images --repository-name "$repo" --image-ids imageDigest="$digest" \
                       --query 'imageDetails[0].imageDigest' --output text 2>&1); then
              echo "$repo: $digest is already in ECR (an earlier release copied it)"
            elif grep -q ImageNotFoundException <<<"$out"; then
              crane copy "$src" "$dst:$tag"
            else
              echo "::error::describe-images $repo: $out"; exit 1
            fi

            # Proved from what ECR serves, not from crane's report: the bytes
            # behind the digest hash to it, the tag resolves to it, ECR's own
            # record names it, and every platform manifest is there with
            # linux/arm64 among them.
            crane manifest "$dst@$digest" > index.json
            [ "sha256:$(sha256sum < index.json | cut -d' ' -f1)" = "$digest" ] \
              || { echo "::error::ECR's manifest for $dst@$digest does not hash to $digest"; exit 1; }
            [ "$(crane digest "$dst:$tag")" = "$digest" ] \
              || { echo "::error::$dst:$tag does not resolve to $digest"; exit 1; }
            [ "$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)" = "$digest" ] \
              || { echo "::error::ECR records a different digest for $repo:$tag"; exit 1; }
            jq -e '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "arm64")' index.json >/dev/null \
              || { echo "::error::$dst@$digest has no linux/arm64 manifest"; exit 1; }
            for child in $(jq -r '.manifests[].digest' index.json); do
              [ "sha256:$(crane manifest "$dst@$child" | sha256sum | cut -d' ' -f1)" = "$child" ] \
                || { echo "::error::$dst@$child is missing or altered in ECR"; exit 1; }
            done

            echo "ok   $src -> $dst@$digest"
            echo "- ECR: \`$dst@$digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$key=$dst@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Find the instance
        id: instance
        run: |
          set -euo pipefail
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=unify-compute-$ENVIRONMENT" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          n=$(wc -w <<<"$ids")
          [ "$n" = 1 ] || { echo "::error::expected exactly one running instance tagged Name=unify-compute-$ENVIRONMENT, found $n: $ids"; exit 1; }
          echo "id=$ids" >> "$GITHUB_OUTPUT"
          echo "instance: $ids"

      # Read off the host BEFORE anything changes, so the record's "previous"
      # line is evidence rather than reconstruction.
      - name: What the host runs now
        env:
          INSTANCE: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail
          {
            echo "ACTION='status'"
            echo "ENV_NAME='$ENVIRONMENT'"
            echo "RELEASE_ID='$GITHUB_RUN_ID'"
            echo "REGION='$AWS_REGION'"
            cat scripts/release/host.sh
          } > status.sh
          scripts/ssm-run.sh "$INSTANCE" status.sh "status $ENVIRONMENT $GITHUB_RUN_ID" 120
          sed -n 's/^CURRENT /- before: /p' status.sh.out >> "$GITHUB_STEP_SUMMARY"

      - name: Back up, cut over, verify on the host (restores the previous images on failure)
        if: inputs.mode != 'status'
        env:
          INSTANCE: ${{ steps.instance.outputs.id }}
          HOST_API: ${{ steps.ecr.outputs.api }}
          HOST_SITE: ${{ steps.ecr.outputs.site }}
        run: |
          set -euo pipefail
          target=""
          if [ "$MODE" = release ]; then
            [ -n "$HOST_API" ] && [ -n "$HOST_SITE" ] || { echo "::error::no ECR refs from the copy step"; exit 1; }
            target="COMPUTE_API_IMAGE=$HOST_API SITE_IMAGE=$HOST_SITE"
          fi
          # Values were validated in `plan` (digest refs, a run id, a fixed
          # choice), so single quotes are sufficient. The free-text reason is
          # deliberately absent.
          {
            echo "ACTION='$MODE'"
            echo "ENV_NAME='$ENVIRONMENT'"
            echo "RELEASE_ID='$GITHUB_RUN_ID'"
            echo "REGION='$AWS_REGION'"
            echo "TARGET='$target'"
            cat scripts/release/host.sh
          } > cutover.sh
          scripts/ssm-run.sh "$INSTANCE" cutover.sh "$MODE $ENVIRONMENT $GITHUB_RUN_ID" 1500

      # The host speaks ECR refs. Everything after this step (the manifest
      # the staging-first gate reads, the record CI checks) speaks GHCR refs,
      # which name the same digest and are what provenance was proved for.
      - name: Read what was released
        id: released
        if: inputs.mode != 'status'
        env:
          HOST_API: ${{ steps.ecr.outputs.api }}
          HOST_SITE: ${{ steps.ecr.outputs.site }}
        run: |
          set -euo pipefail
          api=$(sed -n 's/^RELEASED COMPUTE_API_IMAGE=//p' cutover.sh.out)
          site=$(sed -n 's/^RELEASED SITE_IMAGE=//p' cutover.sh.out)
          [ -n "$api" ] && [ -n "$site" ] || { echo "::error::the host did not report what it released"; exit 1; }
          if [ "$MODE" = release ] && { [ "$api" != "$HOST_API" ] || [ "$site" != "$HOST_SITE" ]; }; then
            echo "::error::the host released $api / $site, not what was asked"; exit 1
          fi
          as_ghcr() { sed -E 's#^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/(unify-compute-(api|site))@#ghcr.io/felixsphere/\1@#' <<<"$1"; }
          api=$(as_ghcr "$api"); site=$(as_ghcr "$site")
          if [ "$MODE" = release ] && { [ "$api" != "$API" ] || [ "$site" != "$SITE" ]; }; then
            echo "::error::$api / $site do not map back to the GHCR refs asked for"; exit 1
          fi
          {
            echo "compute_api_image=$api"
            echo "site_image=$site"
            echo "previous_compute_api_image=$(as_ghcr "$(sed -n 's/^CURRENT COMPUTE_API_IMAGE=//p' cutover.sh.out)")"
            echo "previous_site_image=$(as_ghcr "$(sed -n 's/^CURRENT SITE_IMAGE=//p' cutover.sh.out)")"
            echo "backup=$(sed -n 's/^BACKUP [^ ]* //p' cutover.sh.out)"
            if grep -qx NOOP cutover.sh.out; then echo "noop=true"; else echo "noop=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Smoke from outside
        if: inputs.mode != 'status'
        env:
          ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          EXPECT_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          [ -n "$ORIGIN" ] || { echo "::error::set the PUBLIC_ORIGIN variable (the site origin) on the $ENVIRONMENT environment"; exit 1; }
          [ -n "$API_ORIGIN" ] || { echo "::error::set the API_ORIGIN variable (compute-api's origin) on the $ENVIRONMENT environment"; exit 1; }
          if ! scripts/release/smoke.sh; then
            {
              echo "## Smoke FAILED after cutover"
              echo
              echo "The host passed its own checks, so it was not rolled back automatically."
              echo "Decide, then if it is the release:"
              echo
              echo "\`\`\`"
              echo "gh workflow run release.yml --ref main -f environment=$ENVIRONMENT -f mode=rollback -f reason=\"rollback: <why>\""
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Public domain is served by AWS (after the DNS cutover only)
        if: inputs.environment == 'production' && inputs.mode != 'status'
        env:
          DNS_CUTOVER: ${{ vars.DNS_CUTOVER }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          DOMAIN: compute.unifyai.us
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          ORIGIN: https://compute.unifyai.us
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          EXPECT_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          if [ "$DNS_CUTOVER" != "done" ]; then
            echo "::notice::compute.unifyai.us has not been cut over to AWS (vars.DNS_CUTOVER != done); smoke ran against PUBLIC_ORIGIN only."
            echo "- DNS: compute.unifyai.us not cut over yet; checked \`$PUBLIC_ORIGIN\` only" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/release/served-by-aws.sh
          if [ "$ORIGIN" != "$PUBLIC_ORIGIN" ]; then scripts/release/smoke.sh; fi

      # LAST step on purpose: this artifact is what the production gate looks
      # for, so it must exist only for a run where everything above passed.
      - name: Write the release manifest
        if: inputs.mode != 'status'
        id: manifest
        env:
          R_API: ${{ steps.released.outputs.compute_api_image }}
          R_SITE: ${{ steps.released.outputs.site_image }}
        run: |
          set -euo pipefail
          mkdir manifest
          {
            echo "ENVIRONMENT=$ENVIRONMENT"
            echo "ACTION=$MODE"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "COMMIT=$GITHUB_SHA"
            echo "COMPUTE_API_IMAGE=$R_API"
            echo "SITE_IMAGE=$R_SITE"
          } > manifest/manifest.env
          a=${R_API#*@sha256:}; s=${R_SITE#*@sha256:}
          echo "name=release-manifest-$ENVIRONMENT-${a:0:12}-${s:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: inputs.mode != 'status'
        with:
          name: ${{ steps.manifest.outputs.name }}
          path: manifest/manifest.env
          retention-days: 90

      - name: The record to write
        if: inputs.mode != 'status'
        env:
          R_API: ${{ steps.released.outputs.compute_api_image }}
          R_SITE: ${{ steps.released.outputs.site_image }}
          P_API: ${{ steps.released.outputs.previous_compute_api_image }}
          P_SITE: ${{ steps.released.outputs.previous_site_image }}
          BACKUP: ${{ steps.released.outputs.backup }}
          NOOP: ${{ steps.released.outputs.noop }}
        run: |
          hotfix=false; [[ "$REASON" == HOTFIX* ]] && hotfix=true
          {
            echo
            echo "A pushed commit is not a release, and neither is this run until it is written down."
            echo "Commit this as \`deploy/releases/$(date -u +%Y-%m-%d)-<name>.md\` within 24h (ci.yml checks):"
            echo
            echo '```markdown'
            echo "---"
            echo "environment: $ENVIRONMENT"
            echo "action: $MODE"
            echo "outcome: success"
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "compute_api_image: $R_API"
            echo "site_image: $R_SITE"
            echo "previous_compute_api_image: ${P_API:-none}"
            echo "previous_site_image: ${P_SITE:-none}"
            echo "hotfix: $hotfix"
            echo "---"
            echo
            echo "# $(date -u +%Y-%m-%d) — $REASON"
            echo
            echo "Backup: \`${BACKUP:-none (no-op)}\`. No-op: $NOOP."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
