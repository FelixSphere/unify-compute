# The machine checks for this repository. There are no credentials here and no
# deploy job: releases are the CI/CD agent's (.claude/agents/cicd.md). The
# marketing site is moving from OpenAI Sites to the `site` container
# (deploy/site/, ADR-0009); this workflow builds and exercises that image but
# never pushes it — publish-image.yml does, and release.yml deploys it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Reject Terraform state, saved plans and env files
        run: |
          tracked=$(git ls-files '*.tfplan' '*.tfstate' '*.tfstate.*' 'deploy/compose/.env')
          if [ -n "$tracked" ]; then
            echo "These must never be committed:"; echo "$tracked"; exit 1
          fi

      - name: Agent entry files point at AGENTS.md
        run: |
          grep -qx '@AGENTS.md' CLAUDE.md
          grep -q 'AGENTS.md' .cursor/rules/agents.mdc
          grep -q 'AGENTS.md' .github/copilot-instructions.md

  # One record per release under deploy/releases/, in the shape the README
  # defines, and every successful release.yml run older than a day cited by
  # one. A run nobody wrote down is found later by whoever needed to know what
  # shipped. Also lints the release scripts, which `infra-checks` does not
  # reach (it globs scripts/*.sh only); the host script is POSIX sh because
  # SSM runs it with `sh`.
  release-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Release records
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-records.sh
      - name: shellcheck the release scripts
        run: |
          shellcheck -s sh scripts/release/host.sh
          shellcheck scripts/release/*.sh

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scoped to our code. components/ui and hooks are generated shadcn
      # output and fail oxlint's a11y and react-compiler rules as shipped; see
      # AGENTS.md. Formatting is not checked yet: app/ predates .oxfmtrc.json.
      - run: npx oxlint app lib
      - run: npm run build

  # The site container, run for real: every route the export must answer, the
  # content types browsers enforce under nosniff, and the cache headers a
  # release depends on. One arch is enough here; publish-image.yml builds and
  # asserts arm64.
  site-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/site/Dockerfile
          load: true
          push: false
          provenance: false
          build-args: SITE_BUILD_ID=${{ github.sha }}
          tags: unify-compute-site:ci
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max
      - name: Run
        run: |
          docker run -d --name site -p 8080:8080 unify-compute-site:ci
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          docker logs site; exit 1
      - name: Runs unprivileged
        run: test "$(docker exec site id -u)" = 65534
      # The image's HEALTHCHECK (and compose's, which reuses it) shells out to
      # busybox wget. Prove the binary is there and the check goes healthy,
      # rather than learning it from an instance that never turns healthy.
      - name: Docker healthcheck goes healthy
        run: |
          docker exec site wget -q -O /dev/null http://127.0.0.1:8080/healthz
          # First probe runs one --interval (30s) after start.
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' site)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "health status: $status"; docker inspect -f '{{json .State.Health}}' site; exit 1
      - run: deploy/site/smoke.sh http://127.0.0.1:8080
      # smoke.sh proves the navigation payloads are served; this clicks the
      # links in headless Chrome (preinstalled on the runner) and proves the
      # router uses them. Node 22 for the built-in WebSocket it drives CDP with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node deploy/site/browser-check.mjs http://127.0.0.1:8080
      - if: failure()
        run: docker logs site

  compute-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job store's tests run against a real Postgres; they skip without
    # COMPUTE_TEST_DATABASE_URL, so this service is what makes CI exercise
    # them. Same major as deploy/compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compute
          POSTGRES_PASSWORD: compute
          POSTGRES_DB: compute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compute -d compute_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      COMPUTE_TEST_DATABASE_URL: postgres://compute:compute@localhost:5432/compute_test?sslmode=disable
    defaults:
      run:
        working-directory: compute-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: compute-api/go.mod
          cache-dependency-path: compute-api/go.mod
      # gofmt is checked rather than run: a diff in CI is a review comment, a
      # rewrite in CI is a surprise commit nobody read.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; gofmt -d .; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Container builds
        run: docker build --build-arg BUILD=${{ github.sha }} -t compute-api:ci .

  # The IMDS lockdown (scripts/imds-lockdown.sh, ADR-0005 amendment of
  # 2026-10-03), run for real: the runner is a VM with systemd, Docker and
  # iptables-nft, like the hosts. A fake IMDS answers at 169.254.169.254 from
  # its own network namespace, so container traffic to it is routed through
  # the host exactly as on EC2. What this cannot show is the instance's hop
  # limit of 1, which only EC2 enforces; check-imds.sh on the host covers it.
  imds-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck (POSIX sh, as SSM runs them)
        run: |
          shellcheck -s sh scripts/imds-lockdown.sh scripts/release/check-imds.sh
          # The two scripts the lockdown installs on the host.
          awk '/cat > "\$FIREWALL" <<.SH./{f=1;next} /^SH$/{f=0} f' scripts/imds-lockdown.sh > "$RUNNER_TEMP/firewall.sh"
          awk '/cat > "\$REFRESH" <<.SH./{f=1;next} /^SH$/{f=0} f' scripts/imds-lockdown.sh > "$RUNNER_TEMP/refresh.sh"
          test -s "$RUNNER_TEMP/firewall.sh" && test -s "$RUNNER_TEMP/refresh.sh"
          shellcheck -s sh "$RUNNER_TEMP/firewall.sh" "$RUNNER_TEMP/refresh.sh"

      - name: A fake IMDS behind the host, as on EC2
        run: |
          cat > "$RUNNER_TEMP/fake_imds.py" <<'PY'
          import datetime, http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def reply(self, code, body=""):
                  b = body.encode()
                  self.send_response(code)
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_PUT(self):
                  ok = self.path == "/latest/api/token" and self.headers.get("X-aws-ec2-metadata-token-ttl-seconds")
                  self.reply(200, "tok") if ok else self.reply(400)
              def do_GET(self):
                  if self.headers.get("X-aws-ec2-metadata-token") != "tok":
                      return self.reply(401)
                  if self.path == "/latest/meta-data/iam/security-credentials/":
                      return self.reply(200, "ci-role")
                  if self.path == "/latest/meta-data/iam/security-credentials/ci-role":
                      exp = datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=6)
                      return self.reply(200, json.dumps({"Code": "Success", "Type": "AWS-HMAC",
                          "AccessKeyId": "ASIACI", "SecretAccessKey": "s", "Token": "t",
                          "Expiration": exp.strftime("%Y-%m-%dT%H:%M:%SZ")}, indent=2))
                  self.reply(404)
          http.server.HTTPServer(("169.254.169.254", 80), H).serve_forever()
          PY
          sudo ip netns add imds
          sudo ip link add imds-h type veth peer name imds-n
          sudo ip link set imds-n netns imds
          sudo ip addr add 169.254.170.1/30 dev imds-h
          sudo ip link set imds-h up
          sudo ip netns exec imds sh -c '
            ip link set lo up
            ip addr add 169.254.170.2/30 dev imds-n
            ip addr add 169.254.169.254/32 dev imds-n
            ip link set imds-n up
            ip route add default via 169.254.170.1'
          # Replaces the runner's route to Azure's own metadata service.
          sudo ip route replace 169.254.169.254/32 via 169.254.170.2 dev imds-h
          sudo ip netns exec imds python3 "$RUNNER_TEMP/fake_imds.py" > "$RUNNER_TEMP/fake_imds.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -m 1 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token && break
            sleep 0.5
          done
          echo

      - name: A host before the lockdown
        run: |
          d="$RUNNER_TEMP/compose"; mkdir -p "$d"
          cat > "$d/docker-compose.yml" <<'YAML'
          services:
            compute-api:
              image: alpine:3.20
              command: ["sleep", "infinity"]
              restart: unless-stopped
            console:
              image: alpine:3.20
              command: ["sleep", "infinity"]
              restart: unless-stopped
              networks: [default, other]
          networks:
            other: {}
          YAML
          echo COMPOSE_FILE=docker-compose.yml > "$d/.env"
          (cd "$d" && sudo docker compose --env-file .env up -d --quiet-pull)
          # Outside the compose project: the rule is not about compose.
          sudo docker run -d --quiet --name stray --restart unless-stopped alpine:3.20 sleep infinity
          # The check must see the hole before it can be trusted to see it closed.
          if sudo sh scripts/release/check-imds.sh > before.txt; then
            cat before.txt; echo "::error::check-imds passed on a host that is not locked down"; exit 1
          fi
          cat before.txt
          for c in compose-compute-api-1 compose-console-1 stray; do
            grep -qx "FAIL $c: IMDS answered HTTP 200" before.txt || { echo "::error::$c did not reach the fake IMDS before the lockdown"; exit 1; }
          done

      - name: Lock down, then check
        run: |
          sudo env COMPOSE_DIR="$RUNNER_TEMP/compose" sh scripts/imds-lockdown.sh | tee lockdown.txt
          tail -n 1 lockdown.txt | grep -qx 'IMDS_LOCKDOWN_DONE all'
          sudo sh scripts/release/check-imds.sh
          test "$(sudo stat -c '%u %a' /run/unify-compute/compute-api-aws/credentials.json)" = "65532 400"

      - name: Idempotent
        run: |
          sudo env COMPOSE_DIR="$RUNNER_TEMP/compose" sh scripts/imds-lockdown.sh | tail -n 1 | grep -qx 'IMDS_LOCKDOWN_DONE all'
          test "$(sudo iptables -t raw -S PREROUTING | grep -c unify-compute-imds)" = 1
          test "$(sudo grep -o docker-compose.imds.yml "$RUNNER_TEMP/compose/.env" | wc -l)" = 1

      - name: The rule survives a Docker restart, and a lost one comes back with it
        run: |
          wait_up() {
            for _ in $(seq 1 30); do
              [ "$(sudo docker ps -q | wc -l)" = 3 ] && return 0
              sleep 1
            done
            sudo docker ps -a; return 1
          }
          sudo systemctl restart docker
          wait_up
          sudo sh scripts/release/check-imds.sh

          # Removed behind the unit's back: the check and host.sh's guard see it...
          sudo iptables -t raw -D PREROUTING -d 169.254.169.254/32 -m comment --comment unify-compute-imds -j DROP
          if sudo /usr/local/sbin/unify-compute-imds-firewall check; then echo "::error::check missed a removed rule"; exit 1; fi
          if sudo sh scripts/release/check-imds.sh > lost.txt; then cat lost.txt; echo "::error::check-imds passed without the rule"; exit 1; fi
          cat lost.txt
          # ...and restarting Docker re-applies it (PartOf=docker.service).
          sudo systemctl restart docker
          wait_up
          sudo sh scripts/release/check-imds.sh
          test "$(sudo iptables -t raw -S PREROUTING | grep -c unify-compute-imds)" = 1

      - name: Diagnostics
        if: failure()
        run: |
          sudo iptables -t raw -S PREROUTING || true
          sudo systemctl status unify-compute-imds-firewall unify-compute-api-credentials.timer --no-pager || true
          sudo docker ps -a || true
          cat "$RUNNER_TEMP/fake_imds.log" || true

  # Named for what it does. It was called `deploy`, which invited the
  # assumption that merging to main ships something; nothing here has
  # credentials and nothing here deploys.
  infra-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to the floor in versions.tf, not to the latest release: CI's
      # job is to prove the minimum version we claim to support actually
      # works. It was 1.9.8, which cannot parse backend.tf's `use_lockfile` —
      # invisible here only because `make tf-validate` runs `-backend=false`.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - run: make tf-validate

      # Catches a malformed compose file before it reaches an instance, where
      # the failure mode is a boot that silently does nothing.
      - run: make compose-config

      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck scripts/*.sh deploy/site/*.sh

  # Every image this repository pins must be pinned BY DIGEST, exist in the
  # registry, AND carry a linux/arm64 manifest. Every hosted environment is
  # Graviton (t4g.small); an amd64-only image fails as a container that never
  # starts, long after `terraform apply` has reported success. A tag is not a
  # pin: it can move under a running environment, and the instance re-pulls on
  # every rebuild.
  #
  # This job exists because on 11 Sep 2026 the pinned
  # ghcr.io/felixsphere/unify-compute-api did not exist in the registry at all
  # (NAME_UNKNOWN) while the staging stack pinned it as the default. A first
  # apply would have booted a host that could never pull.
  #
  # It is expected to be RED until compute-api and the site image are
  # published and their digests pinned in deploy/aws/envs/*/variables.tf.
  # That is the truthful state — neither environment can boot yet — and
  # weakening the check to make it green would hide exactly that.
  #
  # Our own pins are ECR refs (<acct>.dkr.ecr.<region>.amazonaws.com/
  # unify-compute-{api,site}@sha256:D), the hosts' runtime registry. CI has no
  # AWS credentials and must keep it that way, so it cannot read ECR. What it
  # checks instead is the source of that copy: the same digest D at
  # ghcr.io/felixsphere/<same repository>, where publish-image.yml pushed it
  # and from which release.yml copies it into ECR, unchanged and verified,
  # before any host is cut over. A digest is the content, so "D exists on
  # GHCR with arm64" is the property the ECR copy inherits. Whether a given
  # digest has been copied yet is a release-time fact (release.yml), not a
  # repository one.
  pinned-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Every pinned image is a digest, exists, and runs on arm64
        run: |
          set -euo pipefail
          # Pins live in two places: the environment roots' variable defaults
          # (our images and the console), and literal image lines in the
          # compose files (Postgres, Redis). `${...}` lines in compose are
          # filled from the former. If pins move, this is what to update.
          images=$( {
            grep -hoE 'ghcr\.io/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?' \
              deploy/aws/envs/*/variables.tf
            grep -hoE '[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?(@sha256:[0-9a-f]{64})?' \
              deploy/aws/envs/*/variables.tf
            grep -hE '^[[:space:]]*image:[[:space:]]*[^$[:space:]]' deploy/compose/docker-compose*.yml \
              | sed -E 's/^[[:space:]]*image:[[:space:]]*//'
          } | sort -u)
          [ -n "$images" ] || { echo "::error::found no pinned images to check"; exit 1; }

          fail=0
          for ref in $images; do
            echo "--- $ref"
            case "$ref" in
              *@sha256:*) ;;
              *) echo "::error::$ref is not pinned by digest (expected name[:tag]@sha256:<64 hex>)"; fail=1 ;;
            esac
            # name:tag@digest is valid for docker pull (the tag is ignored); the
            # inspection uses the digest alone so it checks exactly that.
            inspect_ref=$(printf '%s' "$ref" | sed -E 's/:[A-Za-z0-9._-]+@/@/')
            case "$inspect_ref" in
              *.dkr.ecr.*)
                if [[ ! "$inspect_ref" =~ ^871376691052\.dkr\.ecr\.us-east-1\.amazonaws\.com/(unify-compute-(api|site))@sha256:[0-9a-f]{64}$ ]]; then
                  echo "::error::$ref is not one of our ECR repositories (871376691052.dkr.ecr.us-east-1.amazonaws.com/unify-compute-{api,site}@sha256:<digest>)"
                  fail=1; continue
                fi
                inspect_ref="ghcr.io/felixsphere/${BASH_REMATCH[1]}@${inspect_ref#*@}"
                echo "    ECR pin; checking its source $inspect_ref"
                ;;
            esac
            if ! docker buildx imagetools inspect "$inspect_ref" --raw > m.json 2>err.txt; then
              echo "::error::$ref is not pullable: $(head -c 300 err.txt)"
              fail=1; continue
            fi
            if jq -e 'has("manifests")' m.json >/dev/null; then
              arches=$(jq -r '[.manifests[] | select(.platform.os=="linux") | .platform.architecture] | sort | join(",")' m.json)
            else
              # Single-platform image: read the config's architecture.
              arches=$(docker buildx imagetools inspect "$inspect_ref" --format '{{.Image.Architecture}}' 2>/dev/null || echo unknown)
            fi
            echo "    linux arches: $arches"
            case ",$arches," in
              *,arm64,*) echo "    ok: arm64 present" ;;
              *) echo "::error::$ref has no linux/arm64 manifest — it cannot run on t4g"; fail=1 ;;
            esac
          done
          exit "$fail"
