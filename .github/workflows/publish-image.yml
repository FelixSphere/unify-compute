# Publishes compute-api, the marketing site's `site` image, or the `finetune`
# workload image, to GHCR.
#
# This exists because `ci.yml` builds the container and throws it away, while
# `deploy/aws/staging` pins `ghcr.io/felixsphere/unify-compute-api`. On
# 11 Sep 2026 that repository did not exist in the registry at all
# (`NAME_UNKNOWN`), so a first `terraform apply` would have booted an instance
# whose `docker compose up` could never pull — and terraform would have
# reported success. Nothing may pin an image this workflow has not published.
#
# Multi-arch is not optional: staging and UnifyAPI production are both
# Graviton (`t4g.small`). An amd64-only image will not run there, and that
# failure appears as a container that never starts rather than as a pull
# error. The arm64 assertion below is the gate.
#
# The site image (deploy/site/) is published the same way by the
# `publish-site` job: a `site-v*` tag, or a dispatch with image=site. The
# workflow name is kept as it was so anything that refers to it by name still
# matches; run-name says which image a run published.
name: Publish compute-api image
run-name: >-
  Publish ${{ github.event_name == 'push' && (startsWith(github.ref_name, 'site-v') && 'site' || startsWith(github.ref_name, 'finetune-v') && 'finetune' || 'compute-api') || inputs.image }}
  ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

on:
  push:
    tags: ["compute-api-v*", "site-v*", "finetune-v*"]
  workflow_dispatch:
    inputs:
      image:
        description: "Which image to publish"
        type: choice
        options: [compute-api, site, finetune]
        default: compute-api
      tag:
        description: "Image tag to publish (e.g. dev, compute-api-v0.1.0, site-v0.1.0)"
        required: true
        default: dev
      reason:
        description: "Why this is being published — recorded in the run"
        required: true

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/felixsphere/unify-compute-api
  SITE_IMAGE: ghcr.io/felixsphere/unify-compute-site
  FINETUNE_IMAGE: ghcr.io/felixsphere/unify-compute-finetune

jobs:
  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'compute-api-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'compute-api')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # The same checks ci.yml runs. A tag push does not wait for another
      # workflow, so an image is never published from code that has not passed.
      - uses: actions/setup-go@v5
        with:
          go-version-file: compute-api/go.mod
          cache-dependency-path: compute-api/go.mod
      - name: Test before publishing
        working-directory: compute-api
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; gofmt -d .; exit 1; fi
          go vet ./...
          go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: compute-api
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: BUILD=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The published manifest must carry arm64, and the digest is what the
      # deploy pins — a tag can be repointed by whoever can push, a digest
      # cannot. Read this from the registry, not from the build: the build
      # saying "ok" is the control plane talking about itself.
      - name: Assert the published manifest carries arm64
        run: |
          REF="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$REF" --raw > manifest.json
          cat manifest.json
          if ! jq -e '.manifests[]? | select(.platform.architecture == "arm64" and .platform.os == "linux")' manifest.json >/dev/null; then
            echo "::error::published manifest has no linux/arm64 — staging and production are t4g (Graviton) and cannot run this image"
            exit 1
          fi
          jq -e '.manifests[]? | select(.platform.architecture == "amd64" and .platform.os == "linux")' manifest.json >/dev/null \
            || { echo "::error::published manifest has no linux/amd64"; exit 1; }

      - name: Record what to pin
        run: |
          {
            echo "### compute-api published"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ env.IMAGE }}:${{ steps.tag.outputs.value }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| reason | ${{ inputs.reason || 'tag push' }} |"
            echo
            echo "Pin the **digest** in \`deploy/aws/envs/staging/variables.tf\` (and production's once staging has run it):"
            echo
            echo "\`\`\`hcl"
            echo "compute_api_image = \"${{ env.IMAGE }}@${{ steps.build.outputs.digest }}\""
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-site:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'site-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'site')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint before publishing
        run: |
          npm ci
          npx oxlint app lib

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Same image, same smoke as ci.yml, on amd64 before anything is pushed.
      # The multi-arch build below reuses these layers from the cache.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/site/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: SITE_BUILD_ID=${{ github.sha }}
          tags: unify-compute-site:smoke
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max
      - name: Smoke before publishing
        run: |
          docker run -d --name site -p 8080:8080 unify-compute-site:smoke
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          deploy/site/smoke.sh http://127.0.0.1:8080 || { docker logs site; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: SITE_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.SITE_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.SITE_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

      # As for compute-api: read the published manifest from the registry, not
      # from the build's own report.
      - name: Assert the published manifest carries arm64
        run: |
          REF="${{ env.SITE_IMAGE }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$REF" --raw > manifest.json
          cat manifest.json
          if ! jq -e '.manifests[]? | select(.platform.architecture == "arm64" and .platform.os == "linux")' manifest.json >/dev/null; then
            echo "::error::published manifest has no linux/arm64 — staging and production are t4g (Graviton) and cannot run this image"
            exit 1
          fi
          jq -e '.manifests[]? | select(.platform.architecture == "amd64" and .platform.os == "linux")' manifest.json >/dev/null \
            || { echo "::error::published manifest has no linux/amd64"; exit 1; }

      - name: Record what to pin
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### site published"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ env.SITE_IMAGE }}:${{ steps.tag.outputs.value }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| reason | ${{ inputs.reason || 'tag push' }} |"
            echo
            echo "Pin the **digest**, never the tag:"
            echo
            echo "\`\`\`"
            echo "${{ env.SITE_IMAGE }}@${{ steps.build.outputs.digest }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The finetune workload image (finetune/Dockerfile): the reference run's
  # scripts and pinned TRL/PEFT on top of the vLLM image the batch templates
  # use. amd64 only, because it runs on x86 GPU workers (g5), never on the
  # Graviton hosts; the pinned-images job does not check templates.json. It
  # is pinned by digest in compute-api/config/templates.json (finetune-lora,
  # batch-infer-lora) by a follow-up PR, and the GHCR package must be public
  # for workers to pull it without credentials.
  publish-finetune:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'finetune-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.image == 'finetune')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scripts compile before building
        run: python3 -m py_compile finetune/*.py

      # The base image is about 10 GB unpacked and the runner has about 14 GB
      # free: the first publish (run 37257555345) died with "no space left"
      # while unpacking it. Drop the toolchains nothing here uses, and build
      # once rather than twice (the Dockerfile's RUN steps already import
      # every dependency and compile every script, so a separate loaded smoke
      # image was a second 10 GB copy for nothing). No GHA layer cache either:
      # it is capped at 10 GB and the base layers come from Docker Hub anyway.
      # The vLLM base unpacks to more than the runner's free space: three
      # publishes (37257555345, 37258182528, 37259130251) died with "no space
      # left on device" while the daemon registered its layers, the last one
      # with 32 GB free. ubuntu-latest has one 72 GB disk (no separate /mnt),
      # about 40 GB of it preinstalled toolchains this job never touches. So:
      # remove them, drop the swap file, and build with the daemon's storage
      # (driver: docker) so there is one copy of every layer, not two. No GHA
      # layer cache either: capped at 10 GB, and the base comes from Docker Hub.
      - name: Free the disk for the base image
        run: |
          echo "before:"; df -h / | tail -n 1
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/lib/jvm /usr/share/swift /usr/local/julia* /opt/az \
            /usr/lib/google-cloud-sdk /usr/share/miniconda /opt/microsoft /usr/lib/firefox \
            /opt/google /usr/local/share/chromium /usr/local/share/powershell /usr/local/lib/heroku \
            /usr/local/lib/node_modules /usr/share/sbt /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get purge -y --auto-remove '^llvm-.*' '^dotnet-.*' '^temurin-.*' '^mongodb-.*' '^mysql-.*' '^postgresql-.*' \
            azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri 2>/dev/null || true
          sudo apt-get clean || true
          sudo docker system prune -af --volumes >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -n 1

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: finetune
          file: finetune/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.FINETUNE_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.FINETUNE_IMAGE }}:sha-${{ github.sha }}

      - name: Report the digest to pin
        run: |
          REF="${{ env.FINETUNE_IMAGE }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$REF" --raw > manifest.json
          jq -e '.config.digest // .manifests[0].digest' manifest.json >/dev/null
          df -h / | tail -n 1
          {
            echo "## Published finetune image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ env.FINETUNE_IMAGE }}:${{ steps.tag.outputs.value }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "Pin \`$REF\` as \`image\` of \`finetune-lora\` and \`batch-infer-lora\` in \`compute-api/config/templates.json\`, record the licences in THIRD-PARTY-LICENSES.md, set the GHCR package public, and flip \`available\`."
          } >> "$GITHUB_STEP_SUMMARY"
