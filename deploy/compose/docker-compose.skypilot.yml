# The SkyPilot API server, and compute-api's way to it. An overlay like the
# console's, added to COMPOSE_FILE by scripts/skypilot-host-setup.sh on hosts
# whose stack enables it (staging; production behind skypilot_enabled, off).
# Decision record: docs/adr/0010-gpu-workers-in-the-shared-account.md.
#
# Reachable only from compute-api. No host port, no ALB rule. It sits on two
# networks: `skypilot`, internal and shared with compute-api alone, and
# `skypilot-egress`, which only it joins, for the AWS APIs and SSH to workers.
# The console, Redis, Postgres and the site share neither, so they cannot
# reach it even though they run in the same project. On top of that it
# requires auth: basic auth for its admin (SSM, used once to mint a token) and
# a service-account bearer token for compute-api.
#
# AWS credentials: the host assumes the launch role every 20 minutes into a
# file only this container mounts; botocore re-reads it through
# credential_process before each expiry. SkyPilot itself never needs IMDS,
# which is closed to every container on the host (scripts/imds-lockdown.sh,
# ADR-0005 amendment of 2026-10-03).
#
# Pinned by digest: the multi-arch index of the upstream 0.13.0 release
# (linux/amd64 and linux/arm64), which is tag v0.13.0 of FelixSphere/skypilot
# (b1431e5) unmodified. CI's pinned-images job checks it like every other pin.

services:
  skypilot:
    image: berkeleyskypilot/skypilot:0.13.0@sha256:3bc8bf8f4d83023bae2260b15d01f7581fa2c3e225b75983d92c7f781252662d
    restart: unless-stopped
    # Local mode, not --deploy: --deploy sizes its worker pool from the whole
    # machine on the assumption that the machine is its own. This one is
    # shared with Postgres and the console. Below 2 GB (the limit set here)
    # SkyPilot runs its low-resource mode, which starts request workers on
    # demand instead of keeping a pool resident (sky/server/config.py).
    # SKYPILOT_INITIAL_BASIC_AUTH takes a password hash, and only creates the
    # admin on the server's first start (sky/users/permission.py).
    entrypoint: ["tini", "--"]
    command:
      - /bin/sh
      - -c
      - |
        set -e
        SKYPILOT_INITIAL_BASIC_AUTH="admin:$$(python -c 'import os; from passlib.hash import bcrypt; print(bcrypt.hash(os.environ["SKYPILOT_ADMIN_PASSWORD"]))')"
        export SKYPILOT_INITIAL_BASIC_AUTH
        exec sky api start --host 0.0.0.0 --foreground --enable-basic-auth
    environment:
      SKYPILOT_ADMIN_PASSWORD: ${SKYPILOT_ADMIN_PASSWORD:?set SKYPILOT_ADMIN_PASSWORD}
      ENABLE_SERVICE_ACCOUNTS: "true"
      SKYPILOT_GLOBAL_CONFIG: /etc/skypilot/config.yaml
      AWS_CONFIG_FILE: /etc/skypilot/aws-config
      SKYPILOT_POD_MEMORY_GB_LIMIT: "1.5"
      SKYPILOT_DISABLE_USAGE_COLLECTION: "1"
    mem_limit: 2g
    volumes:
      # Cluster state, the SSH key SkyPilot drives workers with, users and
      # tokens. On the data volume so it survives an instance replacement.
      - ${DATA_DIR:-./data}/skypilot:/root/.sky
      - ./skypilot/config.yaml:/etc/skypilot/config.yaml:ro
      - ./skypilot/aws-config:/etc/skypilot/aws-config:ro
      # A directory, not the file: the refresher replaces the file with a
      # rename, and a file bind mount would keep showing the old inode.
      - ${DATA_DIR:-./data}/skypilot-aws:/run/unify-compute/aws:ro
    networks: [skypilot, skypilot-egress]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:46580/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  compute-api:
    environment:
      # The names C4's backend uses (compute-api/internal/backend,
      # docs/spec/backend.md). compute-api does not read them until the
      # backend is wired into submit; they are set now so that wiring is a
      # code change, not a host change.
      SKYPILOT_API_SERVER_URL: http://skypilot:46580
      SKYPILOT_SERVICE_ACCOUNT_TOKEN: ${SKYPILOT_SERVICE_ACCOUNT_TOKEN:-}
    # Both, explicitly: listing any network replaces the implicit `default`,
    # and compute-api still needs Postgres there.
    networks: [default, skypilot]

networks:
  skypilot:
    internal: true
  skypilot-egress: {}
