<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Account — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="app" data-page="account">
    <!-- @shell:account -->
    <main class="content" id="main" tabindex="-1">
      <!-- @form-error -->
      <div class="page-head">
        <div>
          <h1>Account</h1>
          <p class="page-desc">Who you are signed in as, and how you log in.</p>
        </div>
      </div>

      <section class="profile-head" aria-label="Signed in as">
        <span class="avatar large" id="me-avatar" aria-hidden="true"></span>
        <div>
          <p class="profile-email" id="me-email">—</p>
          <p class="muted" id="me-sub"></p>
        </div>
      </section>

      <section class="card settings" aria-labelledby="security-title">
        <h2 id="security-title">Log-in and security</h2>
        <div class="row">
          <div>
            <strong>Email</strong>
            <p class="muted" id="me-email-row">—</p>
          </div>
        </div>
        <div class="row">
          <div>
            <strong id="password-title">Password</strong>
            <p class="muted">Changing it logs out every other session; this one stays logged in.</p>
            <p class="status-line" id="password-status" role="status"></p>
          </div>
          <button class="ghost small" type="button" id="password-open" aria-expanded="false" aria-controls="password-form-wrap">Change password</button>
        </div>
        <div class="row-form" id="password-form-wrap" hidden>
          <form id="form" novalidate>
            <div class="field">
              <label for="current_password">Current password</label>
              <div class="password">
                <input id="current_password" name="current_password" type="password" autocomplete="current-password" required aria-describedby="current_password-error" />
                <!-- @toggle:current_password -->
              </div>
              <p class="field-error" id="current_password-error" hidden></p>
            </div>
            <div class="field">
              <label for="password">New password</label>
              <div class="password">
                <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error" />
                <!-- @toggle:password -->
              </div>
              <p class="hint" id="password-hint">At least 12 characters.</p>
              <p class="field-error" id="password-error" hidden></p>
            </div>
            <div class="field">
              <label for="password_confirm">Confirm new password</label>
              <div class="password">
                <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required aria-describedby="password_confirm-error" />
                <!-- @toggle:password_confirm -->
              </div>
              <p class="field-error" id="password_confirm-error" hidden></p>
            </div>
            <div class="actions">
              <button class="primary" type="submit">Change password</button>
              <button class="ghost" type="button" id="password-cancel">Cancel</button>
            </div>
          </form>
        </div>
        <div class="row">
          <div>
            <strong id="sessions-title" tabindex="-1">Other sessions</strong>
            <p class="muted" id="sessions-count" aria-live="polite">Checking for other sessions…</p>
            <p class="status-line" id="sessions-status" role="status"></p>
          </div>
          <button class="ghost small" type="button" id="sessions-end" hidden>Log out other sessions</button>
        </div>
      </section>
    </main>
  </body>
</html>
