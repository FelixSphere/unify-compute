<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Billing — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="app" data-page="billing">
    <!-- @shell:billing -->
    <main class="content" id="main" tabindex="-1">
      <h1 class="sr-only">Billing</h1>
      <!-- @form-error -->
      <section class="focal" aria-labelledby="focal-label">
        <div>
          <p class="eyebrow" id="focal-label">Available balance · USD</p>
          <p class="metric" id="balance-available" aria-live="polite">—</p>
          <p class="sub" id="balance-sub">Loading your balance…</p>
        </div>
        <a class="primary" href="mailto:contactus@felixsphere.com?subject=Unify%20Compute%20credit">Contact us</a>
      </section>
      <section class="card" aria-labelledby="topup-title">
        <h2 id="topup-title">Adding credit</h2>
        <p class="muted">Card top-ups are coming. Until then, contact us and we'll add credit to your balance by hand.</p>
      </section>
      <section class="section" aria-labelledby="history-title">
        <h2 id="history-title">Balance history</h2>
        <div id="history" aria-live="polite"><p class="muted">Loading balance history…</p></div>
        <button class="ghost more" type="button" id="history-more" hidden>Load more</button>
      </section>
    </main>
  </body>
</html>
