<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Reset your password — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-page="reset" data-i18n-title="reset.page-title">
    <!-- @topbar:other -->
    <main class="page">
      <div class="card">
        <!-- @brand -->
        <div id="ask">
          <h1 data-i18n="reset.title">Reset your password</h1>
          <!-- @form-error -->
          <form id="form" method="post" novalidate>
            <div class="field">
              <label for="password" data-i18n="account.new-password">New password</label>
              <div class="password">
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="password-hint password-error" />
                <!-- @toggle:password -->
              </div>
              <p class="hint" id="password-hint" data-i18n="common.password-hint">At least 12 characters.</p>
              <p class="field-error" id="password-error" hidden></p>
            </div>
            <div class="field">
              <label for="password_confirm" data-i18n="common.confirm-password">Confirm password</label>
              <div class="password">
                <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required aria-describedby="password_confirm-error" />
                <!-- @toggle:password_confirm -->
              </div>
              <p class="field-error" id="password_confirm-error" hidden></p>
            </div>
            <button class="primary" type="submit" data-i18n="reset.reset-password">Reset password</button>
          </form>
        </div>
        <div id="done" hidden>
          <h1 tabindex="-1" data-i18n="reset.password-reset">Password reset</h1>
          <p class="lead" data-i18n="reset.your-password-was-changed-and">Your password was changed and every session was logged out. Log in with your new password.</p>
        </div>
        <p class="switch" data-i18n="reset.log-in"><a href="/login">Log in</a></p>
      </div>
      <!-- @below -->
    </main>
  </body>
</html>
