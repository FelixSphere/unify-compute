<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Usage — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="app" data-page="usage">
    <!-- @shell:usage -->
    <main class="content" id="main" tabindex="-1">
      <h1 class="sr-only">Usage</h1>
      <!-- @form-error -->
      <section class="focal" aria-labelledby="focal-label">
        <div>
          <p class="eyebrow" id="focal-label">Spent in <span id="usage-month-label"></span> · USD</p>
          <p class="metric" id="usage-total" aria-live="polite">—</p>
          <p class="sub" id="usage-sub">Settled charges for GPU time, storage and egress.</p>
        </div>
        <div class="month-nav" role="group" aria-label="Month">
          <button class="ghost" type="button" id="month-prev">Previous month</button>
          <button class="ghost" type="button" id="month-next">Next month</button>
        </div>
      </section>
      <section class="section" aria-labelledby="breakdown-title">
        <h2 id="breakdown-title">Breakdown</h2>
        <div id="usage-breakdown" aria-live="polite"><p class="muted">Loading usage…</p></div>
      </section>
      <section class="section" aria-labelledby="days-title">
        <h2 id="days-title">By day</h2>
        <div id="usage-days" aria-live="polite"></div>
      </section>
      <section class="section" aria-labelledby="keys-title">
        <h2 id="keys-title">By API key</h2>
        <div id="usage-keys" aria-live="polite"></div>
      </section>
      <section class="section" aria-labelledby="jobs-title">
        <h2 id="jobs-title">Charged jobs</h2>
        <div class="filters" role="group" aria-label="Filter charged jobs">
          <label>SKU <select id="usage-sku"><option value="">All</option></select></label>
          <label>API key <select id="usage-key"><option value="">All</option></select></label>
        </div>
        <div id="usage-jobs" aria-live="polite"></div>
        <button class="ghost" type="button" id="usage-jobs-more" hidden>Load more</button>
      </section>
    </main>
  </body>
</html>
