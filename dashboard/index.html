<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="app" data-page="overview">
    <!-- @shell:overview -->
    <main class="content" id="main" tabindex="-1">
      <h1 class="sr-only">Overview</h1>
      <!-- @form-error -->
      <section class="focal" aria-labelledby="focal-label">
        <div>
          <p class="eyebrow" id="focal-label">Available balance · USD</p>
          <p class="metric" id="balance-available" aria-live="polite">—</p>
          <p class="sub" id="balance-sub">Loading your balance…</p>
        </div>
      </section>

      <section class="card" aria-labelledby="access-title">
        <h2 id="access-title">Compute access</h2>
        <p class="state" id="access-state" hidden><span class="dot" id="access-dot"></span><span id="access-word"></span></p>
        <p class="muted" id="access-text"></p>
      </section>

      <section class="section" aria-labelledby="recent-title">
        <div class="section-head">
          <h2 id="recent-title">Recent jobs</h2>
          <a href="/jobs">All jobs</a>
        </div>
        <div id="recent-jobs" aria-live="polite"><p class="muted">Loading jobs…</p></div>
      </section>
    </main>
  </body>
</html>
