<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="app" data-page="overview">
    <!-- @shell:overview -->
    <main class="content" id="main" tabindex="-1">
      <h1 class="sr-only">Overview</h1>
      <!-- @form-error -->
      <section class="focal" aria-labelledby="focal-label">
        <div>
          <p class="eyebrow" id="focal-label">Available balance · USD</p>
          <p class="metric" id="balance-available" aria-live="polite">—</p>
          <p class="sub" id="balance-sub">Loading your balance…</p>
        </div>
      </section>

      <section class="card" id="onboarding" aria-labelledby="onboarding-title" hidden>
        <div class="section-head">
          <h2 id="onboarding-title">Get started</h2>
          <p class="progress" id="onboarding-progress"></p>
        </div>
        <ol class="steps" id="onboarding-steps"></ol>
      </section>

      <div class="grid">
        <section class="card" aria-labelledby="spend-label">
          <p class="eyebrow" id="spend-label">Spent this month · USD</p>
          <p class="stat" id="spend-total" aria-live="polite">—</p>
          <p class="muted" id="spend-sub">Loading this month's usage…</p>
        </section>
        <section class="card" aria-labelledby="running-label">
          <p class="eyebrow" id="running-label">Running now</p>
          <div id="running" aria-live="polite"><p class="muted">Loading jobs…</p></div>
        </section>
      </div>

      <section class="card" id="access" aria-labelledby="access-title">
        <h2 id="access-title">Compute access</h2>
        <p class="state" id="access-state" hidden><span class="dot" id="access-dot"></span><span id="access-word"></span></p>
        <p class="muted" id="access-text"></p>
      </section>

      <section class="section" aria-labelledby="recent-title">
        <div class="section-head">
          <h2 id="recent-title">Recent jobs</h2>
          <a href="/jobs">All jobs</a>
        </div>
        <div id="recent-jobs" aria-live="polite"><p class="muted">Loading jobs…</p></div>
      </section>
    </main>
  </body>
</html>
