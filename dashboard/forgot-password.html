<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Reset your password — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" blocking="render" src="/src/main.ts"></script>
  </head>
  <body data-page="forgot" data-i18n-title="forgot.page-title">
    <!-- @topbar:other -->
    <main class="page">
      <div class="card">
        <!-- @brand -->
        <div id="ask">
          <h1 data-i18n="reset.title">Reset your password</h1>
          <p class="lead" data-i18n="forgot.enter-the-email-address-of">Enter the email address of your account and we'll send you a link to reset your password.</p>
          <!-- @form-error -->
          <form id="form" method="post" novalidate>
            <div class="field">
              <label for="email" data-i18n="common.email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" />
              <p class="field-error" id="email-error" hidden></p>
            </div>
            <!-- @honeypot -->
            <button class="primary" type="submit" data-i18n="forgot.send-reset-link">Send reset link</button>
          </form>
        </div>
        <div id="sent" hidden>
          <h1 tabindex="-1" data-i18n="verify.title">Check your email</h1>
          <p class="lead" data-i18n="forgot.if-an-account-uses-we">If an account uses <strong id="sent-email"></strong>, we sent it a link to reset your password. The link expires in 1 hour.</p>
        </div>
        <p class="switch" data-i18n="forgot.remembered-it-log-in">Remembered it? <a href="/login">Log in</a></p>
      </div>
      <!-- @below -->
    </main>
  </body>
</html>
