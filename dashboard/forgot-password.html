<!doctype html>
<html lang="en">
  <head>
    <!-- @head -->
    <title>Reset your password — Unify Compute</title>
    <link rel="stylesheet" href="/src/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-page="forgot">
    <main class="page">
      <div class="card">
        <!-- @brand -->
        <div id="ask">
          <h1>Reset your password</h1>
          <p class="lead">Enter the email address of your account and we'll send you a link to reset your password.</p>
          <!-- @form-error -->
          <form id="form" method="post" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" />
              <p class="field-error" id="email-error" hidden></p>
            </div>
            <button class="primary" type="submit">Send reset link</button>
          </form>
        </div>
        <div id="sent" hidden>
          <h1 tabindex="-1">Check your email</h1>
          <p class="lead">If an account uses <strong id="sent-email"></strong>, we sent it a link to reset your password. The link expires in 1 hour.</p>
        </div>
        <p class="switch">Remembered it? <a href="/login">Log in</a></p>
      </div>
      <!-- @below -->
    </main>
  </body>
</html>
